<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pulse Analytics, a responsive SaaS analytics dashboard." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pulse Analytics</title>
    <script>
      // Apply the saved or OS theme before first paint so there is no light flash in dark mode.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('pulse-theme');
        } catch (error) {
          theme = null;
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
